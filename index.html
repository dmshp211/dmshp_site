  --mono:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  --disp:'Rubik Glitch','Impact',sans-serif;
  color-scheme:dark;box-sizing:border-box;

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden}
body{display:flex;flex-direction:column;justify-content:space-between;cursor:crosshair}
#noise{position:fixed;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;z-index:1}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 45%,#000 100%)}
.roll{position:fixed;left:0;right:0;height:16vh;top:-16vh;z-index:3;pointer-events:none;
  background:linear-gradient(transparent,rgba(255,255,255,.05),transparent);animation:roll 7s linear infinite}
@keyframes roll{to{transform:translateY(130vh)}}

/* marquees */
.strip{position:relative;z-index:2;overflow:hidden;white-space:nowrap;border-block:1px solid #222;padding:.55rem 0;font-size:.8rem;letter-spacing:.18em;color:var(--dim)}
.strip span{display:inline-block;padding-right:2.5rem;animation:mq 28s linear infinite}
.strip.rev span{animation-direction:reverse;animation-duration:36s}
.strip b{color:var(--fg);font-weight:700}
.strip i{color:var(--red);font-style:normal}
@keyframes mq{to{transform:translateX(-100%)}}

main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;min-height:0;padding:0 1rem}

/* logo */
.stage{perspective:900px;width:min(56vh,84vw);aspect-ratio:1/1;position:relative;transform:translate3d(0,0,0);}
.spin{position:absolute;inset:0;transform:translate3d(0,0,0);transform-style:preserve-3d;--spin-duration:9s;--spin-tilt:-14deg;animation:spin var(--spin-duration) linear infinite;will-change:transform;transform-origin:center center}
@keyframes spin{from{transform:translate3d(0,0,0) rotateX(var(--spin-tilt)) rotateY(0deg)}to{transform:translate3d(0,0,0) rotateX(var(--spin-tilt)) rotateY(360deg)}}
.l{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat}
.fz{position:absolute;inset:0}
.l.r{transform:translateX(-4px)}
.l.c{transform:translateX(4px)}
.stage.hit .l.r{animation:sliceR .45s steps(2) 1}
.stage.hit .l.c{animation:sliceC .45s steps(2) 1}
.stage.hit .l.w{animation:jit .45s steps(3) 1}
@keyframes sliceR{0%{transform:translate(-18px,3px);clip-path:inset(10% 0 60% 0)}33%{transform:translate(14px,-4px);clip-path:inset(55% 0 12% 0)}66%{transform:translate(-9px,0);clip-path:inset(30% 0 35% 0)}100%{transform:translateX(-4px);clip-path:none}}
@keyframes sliceC{0%{transform:translate(18px,-3px);clip-path:inset(62% 0 8% 0)}33%{transform:translate(-14px,4px);clip-path:inset(8% 0 62% 0)}66%{transform:translate(10px,0);clip-path:inset(40% 0 25% 0)}100%{transform:translateX(4px);clip-path:none}}
@keyframes jit{0%{transform:skewX(8deg) scaleY(1.04)}50%{transform:skewX(-6deg)}100%{transform:none}}

/* title */
.title{position:relative;margin:0;font:400 clamp(2.4rem,11vw,6.6rem)/1 var(--disp);letter-spacing:.02em;text-align:center}
.title::before,.title::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.title::before{color:var(--red);transform:translateX(-3px);animation:gA 3.1s steps(1) infinite}
.title::after{color:var(--ice);transform:translateX(3px);animation:gB 2.3s steps(1) infinite}
@keyframes gA{0%,86%,100%{clip-path:inset(0 0 100% 0)}87%{clip-path:inset(12% 0 60% 0);transform:translateX(-9px)}91%{clip-path:inset(62% 0 8% 0);transform:translateX(7px)}95%{clip-path:inset(35% 0 40% 0);transform:translateX(-5px)}}
@keyframes gB{0%,78%,100%{clip-path:inset(0 0 100% 0)}79%{clip-path:inset(55% 0 20% 0);transform:translateX(9px)}84%{clip-path:inset(5% 0 75% 0);transform:translateX(-8px)}90%{clip-path:inset(40% 0 35% 0);transform:translateX(6px)}}

.sub{margin:0;font-size:clamp(.75rem,2.6vw,.95rem);letter-spacing:.3em;color:var(--dim);text-align:center}
.sub em{font-style:normal;color:var(--red)}
.not{margin:0;padding:.35rem .8rem;border:1px solid var(--red);color:var(--red);font-weight:700;font-size:.8rem;letter-spacing:.2em;animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,66%{opacity:.15}67%,100%{opacity:1}}
.tg{color:var(--fg);text-decoration:none;font-weight:700;font-size:.9rem;letter-spacing:.25em;padding:.6rem 1.1rem;border:1px solid #3a3a3a;cursor:pointer;transition:border-color .1s}
.tg:hover,.tg:focus-visible{border-color:var(--red);text-shadow:-2px 0 var(--red),2px 0 var(--ice);animation:tgj .25s steps(2) infinite;outline:none}
@keyframes tgj{50%{transform:translateX(2px) skewX(-6deg)}}
.clock{font-size:.75rem;color:var(--dim);letter-spacing:.2em;font-variant-numeric:tabular-nums}
.page-actions{display:flex;align-items:center;justify-content:center;gap:.8rem;flex-wrap:wrap}
.settings-toggle{border:1px solid #302326;background:rgba(12,12,12,.7);color:#999;font:400 .7rem var(--mono);letter-spacing:.08em;padding:.5rem .7rem;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.settings-toggle:hover,.settings-toggle:focus-visible{color:#eee;border-color:var(--red);background:#13090b;outline:none}
.settings-toggle span{color:var(--red);margin-right:.35rem}
.settings-panel{position:fixed;z-index:22;left:50%;bottom:1.5rem;transform:translate(-50%,12px);width:min(540px,calc(100vw - 2rem));max-height:min(76vh,560px);overflow:auto;border:1px solid #3a292c;background:rgba(7,7,7,.98);box-shadow:0 12px 70px #000;padding:1rem 1.1rem;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;backdrop-filter:blur(12px)}
.settings-panel.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
.settings-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.8rem;border-bottom:1px solid #252525;color:#999;font-size:.7rem;letter-spacing:.08em}
.settings-file{color:#eee}.settings-close{font:inherit;color:#999;background:none;border:1px solid #333;padding:.35rem .55rem;cursor:pointer}.settings-close:hover{color:#fff;border-color:#777}
.settings-body{display:grid;grid-template-columns:1fr 1fr;gap:1.05rem 1.2rem;padding:1rem 0}
.setting label{display:flex;justify-content:space-between;align-items:center;gap:.7rem;font-size:.7rem;color:#bbb;margin-bottom:.55rem}
.setting output{color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.setting input[type=range]{display:block;width:100%;margin:0;accent-color:var(--red);cursor:pointer}
.setting-help{display:block;margin-top:.45rem;color:#565656;font-size:.59rem;line-height:1.5}
.setting-switch{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0 .1rem;border-top:1px solid #222;color:#bbb;font-size:.7rem;cursor:pointer}
.setting-switch small{display:block;margin-top:.35rem;color:#5c5c5c;font-size:.6rem;line-height:1.5}
.setting-switch input{width:16px;height:16px;accent-color:var(--red);flex:none;cursor:pointer}
.settings-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid #252525;padding-top:.8rem;color:#565656;font-size:.6rem;line-height:1.5}
.settings-reset{font:inherit;color:#aaa;background:none;border:1px solid #333;padding:.4rem .6rem;white-space:nowrap;cursor:pointer}
.settings-reset:hover{color:#fff;border-color:var(--red)}
@media(max-width:460px){.settings-body{grid-template-columns:1fr;gap:.9rem}.setting-switch{grid-column:1}.settings-panel{bottom:.6rem;padding:.9rem}.settings-foot{align-items:flex-start}}

@media (max-height:560px){.stage{width:34vh}.sub,.clock{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .title::before,.title::after{display:none}
}
</style>
</head>

(function(){

  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // Extruded logo textures are generated locally in this tab.
  var spin=document.querySelector('.spin'),stage=document.getElementById('stage');
  var src=getComputedStyle(document.documentElement).getPropertyValue('--logo').trim().replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
  var img=new Image(),logoTextures=null,logoParams={speed:9,depth:16,tilt:14};
  function renderLogo(){
    if(!logoTextures)return;
    while(spin.firstChild)spin.removeChild(spin.firstChild);
    var D=stage.offsetWidth*(logoParams.depth/100),N=logoParams.depth===0?2:40,half=D/2;
    function mk(cls,bg){var e=document.createElement('div');e.className='l '+cls;e.style.backgroundImage=bg;return e}
    function zl(v){var f=document.createElement('div');f.className='fz';f.style.transform='translateZ('+v+'px)';return f}
    var b=zl(-half);b.appendChild(mk('',logoTextures.W));spin.appendChild(b);
    for(var i=1;i<N-1;i++){var m=zl(-half+i*D/(N-1));m.appendChild(mk('',logoTextures.G));spin.appendChild(m)}
    var f=zl(half);f.appendChild(mk('c',logoTextures.C));f.appendChild(mk('r',logoTextures.R));f.appendChild(mk('w',logoTextures.W));spin.appendChild(f);
    spin.style.setProperty('--spin-duration',logoParams.speed+'s');
    spin.style.setProperty('--spin-tilt','-'+logoParams.tilt+'deg');
  }
  img.onload=function(){
    function tint(col){var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;var x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return 'url('+c.toDataURL()+')'}
    logoTextures={W:tint('#ececec'),G:tint('#4a4a50'),R:tint('#ff1e3c'),C:tint('#2de2ff')};
    renderLogo();
  };
  img.src=src;
  addEventListener('resize',function(){if(logoTextures)renderLogo()});

  // static noise
  var cv=document.getElementById('noise'),cx=cv.getContext('2d');
  function size(){cv.width=Math.max(1,Math.ceil(innerWidth/4));cv.height=Math.max(1,Math.ceil(innerHeight/4))}
  size();addEventListener('resize',size);
  function noise(){
    var w=cv.width,h=cv.height,d=cx.createImageData(w,h),b=d.data;
    for(var i=0;i<b.length;i+=4){var v=Math.random()*255;b[i]=b[i+1]=b[i+2]=v;b[i+3]=255}
    cx.putImageData(d,0,0);
  }
  if(!still){var last=0;(function loop(t){if(t-last>100){noise();last=t}requestAnimationFrame(loop)})(0)}else noise();

  // glitch bursts
  function hit(){
    stage.classList.remove('hit');void stage.offsetWidth;stage.classList.add('hit');
  }
  stage.addEventListener('click',hit);
  var autoGlitch=true,glitchTimer=null;
  function scheduleGlitch(){
    if(still||!autoGlitch)return;
    glitchTimer=setTimeout(function(){hit();scheduleGlitch()},1800+Math.random()*3800);
  }
  scheduleGlitch();

  // Compositor-friendly pointer parallax, updated once per animation frame.
  var main=document.querySelector('main'),pointerX=0,pointerY=0,pointerFrame=0;
  addEventListener('pointermove',function(e){
    if(still)return;
    pointerX=(e.clientX/innerWidth-.5)*2;
    pointerY=(e.clientY/innerHeight-.5)*2;
    if(!pointerFrame)pointerFrame=requestAnimationFrame(function(){
      main.style.transform='translate3d('+(pointerX*6)+'px,'+(pointerY*6)+'px,0)';
      pointerFrame=0;
    });
  },{passive:true});

  // clock
  var clock=document.getElementById('clock');
  function tick(){
    var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
    clock.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick();setInterval(tick,1000);


  // Live logo controls: DOM/CSS only; no requests and no settings sent to the server.
  var settingsToggle=document.getElementById('settingsToggle');
  var settingsPanel=document.getElementById('settingsPanel');
  var closeSettings=document.getElementById('closeSettings');
  var speedControl=document.getElementById('speedControl');
  var depthControl=document.getElementById('depthControl');
  var tiltControl=document.getElementById('tiltControl');
  var autoGlitchControl=document.getElementById('autoGlitchControl');
  var defaults={speed:9,depth:16,tilt:14};
  function setSettingsOpen(open){
    settingsPanel.classList.toggle('open',open);
    settingsPanel.setAttribute('aria-hidden',String(!open));
    settingsToggle.setAttribute('aria-expanded',String(open));
  }
  settingsToggle.addEventListener('click',function(){setSettingsOpen(!settingsPanel.classList.contains('open'))});
  closeSettings.addEventListener('click',function(){setSettingsOpen(false)});
  function updateParams(){
    logoParams.speed=Number(speedControl.value);
    logoParams.depth=Number(depthControl.value);
    logoParams.tilt=Number(tiltControl.value);
    document.getElementById('speedValue').textContent=logoParams.speed+' сек';
    document.getElementById('depthValue').textContent=logoParams.depth+'%';
    document.getElementById('tiltValue').textContent=logoParams.tilt+'°';
    renderLogo();
  }
  [speedControl,depthControl,tiltControl].forEach(function(el){el.addEventListener('input',updateParams)});
  autoGlitchControl.addEventListener('change',function(){
    autoGlitch=autoGlitchControl.checked;
    if(glitchTimer!==null){clearTimeout(glitchTimer);glitchTimer=null}
    if(autoGlitch)scheduleGlitch();
  });
  document.getElementById('resetSettings').addEventListener('click',function(){
    speedControl.value=defaults.speed;depthControl.value=defaults.depth;tiltControl.value=defaults.tilt;
    autoGlitchControl.checked=true;autoGlitch=true;
    if(glitchTimer!==null){clearTimeout(glitchTimer);glitchTimer=null}
    scheduleGlitch();updateParams();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setSettingsOpen(false)});
})();
</script>
</body>
</html>
